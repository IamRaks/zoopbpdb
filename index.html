<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BP Dashboard — GitHub Updater</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#0d1117;color:#e6edf3;min-height:100vh;
    display:flex;align-items:flex-start;justify-content:center;padding:20px}
  .card{background:#161b22;border:1px solid #30363d;border-radius:12px;
    padding:24px 20px;width:100%;max-width:480px;margin-top:10px}
  h1{font-size:17px;font-weight:700;color:#f0a500;margin-bottom:2px}
  .sub{font-size:11px;color:#8b949e;margin-bottom:20px}
  label{font-size:10px;font-weight:700;color:#8b949e;text-transform:uppercase;
    letter-spacing:.06em;display:block;margin-bottom:5px}
  input[type=text],input[type=password]{width:100%;background:#0d1117;
    border:1px solid #30363d;border-radius:6px;padding:9px 11px;
    color:#e6edf3;font-size:13px;margin-bottom:14px;outline:none;font-family:inherit}
  input:focus{border-color:#2f6eb5}
  .pat-wrap{position:relative;margin-bottom:14px}
  .pat-wrap input{margin-bottom:0;padding-right:40px}
  .pat-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:#8b949e;cursor:pointer;font-size:14px;padding:4px}
  .section{border-top:1px solid #30363d;margin-top:6px;padding-top:16px;margin-bottom:16px}
  .section-title{font-size:10px;font-weight:700;color:#8b949e;
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
  .file-picker{border:2px dashed #30363d;border-radius:8px;padding:20px;
    text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:14px}
  .file-picker:hover{border-color:#2f6eb5}
  .file-picker input{display:none}
  .file-picker .ico{font-size:28px;margin-bottom:6px}
  .file-picker .hint{font-size:12px;color:#8b949e}
  .file-picker .fname{font-size:13px;color:#3fb950;font-weight:600;margin-top:4px}
  .file-picker .fsize{font-size:11px;color:#8b949e;margin-top:2px}
  .btn{width:100%;border:none;border-radius:8px;padding:14px;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
    margin-bottom:8px;transition:background .15s}
  .btn-primary{background:#2f6eb5;color:#fff}
  .btn-primary:active{background:#1a5a9e}
  .btn-secondary{background:#21262d;color:#e6edf3;border:1px solid #30363d}
  .btn-secondary:active{background:#30363d}
  .btn:disabled{background:#21262d;color:#484f58;cursor:default;border:1px solid #30363d}
  .prog-wrap{margin:12px 0;display:none}
  .prog-bar{height:5px;background:#21262d;border-radius:3px;overflow:hidden}
  .prog-fill{height:100%;background:#2f6eb5;border-radius:3px;transition:width .3s}
  .prog-lbl{font-size:11px;color:#8b949e;margin-top:5px;text-align:center}
  #log{margin-top:14px;background:#0d1117;border:1px solid #21262d;
    border-radius:8px;max-height:220px;overflow-y:auto;display:none}
  .log-hdr{padding:6px 10px;background:#161b22;border-bottom:1px solid #21262d;
    font-size:10px;font-weight:700;color:#8b949e;letter-spacing:.06em;
    display:flex;justify-content:space-between;align-items:center}
  .log-body{padding:6px 10px;font-family:'Courier New',monospace;font-size:11px;line-height:1.8}
  .ok{color:#3fb950}.err{color:#f85149}.inf{color:#8b949e}.warn{color:#f0a500}
  .save-note{font-size:10px;color:#8b949e;text-align:center;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <h1>📤 BP Dashboard Updater</h1>
  <p class="sub">Replace index.html in GitHub from your phone</p>

  <div class="section">
    <div class="section-title">GitHub Settings</div>
    <label>Username</label>
    <input type="text" id="ghUser" value="IamRaks" placeholder="IamRaks">
    <label>Repository</label>
    <input type="text" id="ghRepo" value="zoopbpdb" placeholder="zoopbpdb">
    <label>Branch</label>
    <input type="text" id="ghBranch" value="main" placeholder="main">
    <label>File path in repo</label>
    <input type="text" id="ghFile" value="index.html" placeholder="index.html">
    <label>Personal Access Token (PAT)</label>
    <div class="pat-wrap">
      <input type="password" id="ghPat" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
        autocomplete="off" spellcheck="false">
      <button class="pat-eye" onclick="togglePat()" id="patEye">👁</button>
    </div>
    <div class="save-note" id="saveNote"></div>
  </div>

  <div class="section">
    <div class="section-title">Select New File</div>
    <div class="file-picker" onclick="document.getElementById('filePick').click()">
      <input type="file" id="filePick" accept=".html" onchange="onFileSelected(this)">
      <div class="ico">📄</div>
      <div class="hint">Tap to select index.html from Downloads</div>
      <div class="fname" id="fileName"></div>
      <div class="fsize" id="fileSize"></div>
    </div>
  </div>

  <button class="btn btn-primary" id="uploadBtn" onclick="uploadToGitHub()" disabled>
    🚀 Upload to GitHub
  </button>
  <button class="btn btn-secondary" onclick="saveSettings()">💾 Save Settings</button>

  <div class="prog-wrap" id="progWrap">
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-lbl" id="progLbl"></div>
  </div>

  <div id="log">
    <div class="log-hdr">
      <span>ACTIVITY LOG</span>
      <span id="logTime" style="font-weight:400"></span>
    </div>
    <div class="log-body" id="logBody"></div>
  </div>
</div>

<script>
let selectedFile = null;
let logLines = [];

window.addEventListener('DOMContentLoaded', () => {
  try {
    const saved = localStorage.getItem('bpUpdaterSettings');
    if (saved) {
      const s = JSON.parse(saved);
      if (s.ghUser)   document.getElementById('ghUser').value   = s.ghUser;
      if (s.ghRepo)   document.getElementById('ghRepo').value   = s.ghRepo;
      if (s.ghBranch) document.getElementById('ghBranch').value = s.ghBranch;
      if (s.ghFile)   document.getElementById('ghFile').value   = s.ghFile;
      if (s.ghPat)    document.getElementById('ghPat').value    = s.ghPat;
      document.getElementById('saveNote').textContent = 'Settings loaded from device.';
    }
  } catch(e) {}
});

function saveSettings() {
  const s = {
    ghUser:   document.getElementById('ghUser').value.trim(),
    ghRepo:   document.getElementById('ghRepo').value.trim(),
    ghBranch: document.getElementById('ghBranch').value.trim(),
    ghFile:   document.getElementById('ghFile').value.trim(),
    ghPat:    document.getElementById('ghPat').value.trim(),
  };
  localStorage.setItem('bpUpdaterSettings', JSON.stringify(s));
  document.getElementById('saveNote').textContent = '✓ Settings saved on this device.';
}

function togglePat() {
  const inp = document.getElementById('ghPat');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  document.getElementById('patEye').textContent = inp.type === 'password' ? '👁' : '🙈';
}

function onFileSelected(input) {
  const file = input.files[0];
  if (!file) return;
  selectedFile = file;
  const kb = Math.round(file.size / 1024);
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileSize').textContent = kb + ' KB · ' + new Date(file.lastModified).toLocaleString();
  document.getElementById('uploadBtn').disabled = false;
  log('Selected: ' + file.name + ' (' + kb + ' KB)', 'inf');
}

function log(msg, type) {
  type = type || 'inf';
  const logEl = document.getElementById('log');
  const body  = document.getElementById('logBody');
  logEl.style.display = 'block';
  document.getElementById('logTime').textContent = new Date().toLocaleTimeString();
  const ts = new Date().toLocaleTimeString('en',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  logLines.push('<div class="' + type + '"><span style="color:#484f58">[' + ts + ']</span> ' + msg + '</div>');
  body.innerHTML = logLines.join('');
  body.scrollTop = body.scrollHeight;
}

function setProgress(pct, lbl) {
  document.getElementById('progWrap').style.display = 'block';
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLbl').textContent = lbl;
}

async function uploadToGitHub() {
  const user   = document.getElementById('ghUser').value.trim();
  const repo   = document.getElementById('ghRepo').value.trim();
  const branch = document.getElementById('ghBranch').value.trim();
  const path   = document.getElementById('ghFile').value.trim();
  const pat    = document.getElementById('ghPat').value.trim();

  if (!user || !repo || !path) { log('Fill in all GitHub fields.', 'err'); return; }
  if (!pat)  { log('PAT is required to write to GitHub.', 'err'); return; }
  if (!selectedFile) { log('Select a file first.', 'err'); return; }

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Uploading...';
  logLines = [];

  const API = 'https://api.github.com/repos/' + user + '/' + repo + '/contents/' + path;
  const HEADERS = {
    'Authorization': 'Bearer ' + pat,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    'Content-Type': 'application/json',
  };

  try {
    log('Reading file...', 'inf');
    setProgress(10, 'Reading file...');
    const fileContent = await readFileAsBase64(selectedFile);
    log('File read: ' + selectedFile.name + ' (' + Math.round(selectedFile.size/1024) + ' KB)', 'ok');
    setProgress(25, 'Connecting to GitHub...');

    log('Fetching current file SHA from GitHub...', 'inf');
    const getResp = await fetch(API + '?ref=' + branch, { headers: HEADERS });

    let sha = null;
    if (getResp.ok) {
      const existing = await getResp.json();
      sha = existing.sha;
      log('Current file found (SHA: ' + sha.substring(0,7) + '...)', 'ok');
    } else if (getResp.status === 404) {
      log('No existing file — will create new.', 'warn');
    } else {
      const err = await getResp.json().catch(() => ({}));
      log('GitHub error ' + getResp.status + ': ' + (err.message || 'unknown'), 'err');
      if (getResp.status === 401) log('Check your PAT — may be expired or missing repo scope.', 'err');
      btn.disabled = false; btn.textContent = '🚀 Upload to GitHub'; return;
    }
    setProgress(50, 'Uploading file...');

    const commitMsg = 'Update ' + path + ' via BP Dashboard Updater — ' + new Date().toLocaleString();
    const body = { message: commitMsg, content: fileContent, branch: branch };
    if (sha) body.sha = sha;

    log('Uploading to ' + user + '/' + repo + '/' + path + '...', 'inf');
    const putResp = await fetch(API, { method:'PUT', headers:HEADERS, body:JSON.stringify(body) });
    setProgress(85, 'Verifying...');

    if (putResp.ok) {
      const result = await putResp.json();
      log('✓ Upload successful!', 'ok');
      log('  Commit: ' + (result.commit && result.commit.sha ? result.commit.sha.substring(0,7) : '?'), 'ok');
      log('  Branch: ' + branch, 'inf');
      log('  GitHub Pages / Netlify will redeploy automatically.', 'inf');
      setProgress(100, '✓ Complete');
      btn.textContent = '✓ Done!';
      setTimeout(() => { btn.textContent = '🚀 Upload to GitHub'; btn.disabled = false; }, 4000);
    } else {
      const err = await putResp.json().catch(() => ({}));
      log('✗ Upload failed (' + putResp.status + '): ' + (err.message || 'unknown'), 'err');
      if (putResp.status === 401) log('Invalid PAT. Ensure it has "repo" or "contents:write" scope.', 'err');
      if (putResp.status === 422) log('File may be too large (GitHub max: 100MB).', 'warn');
      btn.disabled = false; btn.textContent = '🚀 Upload to GitHub';
    }
  } catch(e) {
    log('✗ Error: ' + e.message, 'err');
    log('Check internet connection and try again.', 'inf');
    btn.disabled = false; btn.textContent = '🚀 Upload to GitHub';
  }
}

function readFileAsBase64(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload  = function(e) { resolve(e.target.result.split(',')[1]); };
    reader.onerror = function()  { reject(new Error('File read failed')); };
    reader.readAsDataURL(file);
  });
}
</script>
</body>
</html>
